services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: order-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - order-net

  postgres:
    image: postgres:16-alpine
    container_name: order-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: order_processing
    ports:
      - "5433:5432"
    volumes:
      - order_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d order_processing"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - order-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-api
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8001:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - order-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: order-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      - api
    networks:
      - order-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: order-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - order-net

volumes:
  order_pg_data:

networks:
  order-net:
    driver: bridge
